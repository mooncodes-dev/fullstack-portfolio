ures": ["admin"], "folder": "013-intro-13", "resource": "entries", "label": "항목", "day": 1, "date": "2026-11-22"}, {"num": 14, "title": "방문자 통계가 보이는 소개 페이지", "desc": "페이지 방문 기록(IP가 아닌 날짜와 시간 기준)을 DB에 쌓고, 오늘 방문자 수와 누적 방문자 수를 본인만 볼 수 있는 통계 화면으로 보여주는 기능을 추가하세요.", "category": "나만의 소개 웹페이지", "difficulty": "기본", "features": [], "folder": "014-intro-14", "resource": "entries", "label": "항목", "day": 1, "date": "2026-11-22"}, {"num": 15, "title": "내가 쓴 글 모음 소개 페이지", "desc": "소개 페이지 안에 작은 글 목록 섹션을 만들어, 다른 블로그 서비스가 아닌 내 DB에 저장된 글을 불러와 보여주세요. 글마다 조회수를 기록하고 인기순 정렬도 구현합니다.", "category": "나만의 소개 웹페이지", "difficulty": "심화", "features": [], "folder": "015-intro-15", "resource": "entries", "label": "항목", "day": 1, "date": "2026-11-22"}, {"num": 16, "title": "음악 취향 소개 + 신청곡 페이지", "desc": "좋아하는 노래 목록을 소개하고, 방문자가 신청곡을 남기면 DB에 저장되는 페이지입니다. 신청곡에 좋아요를 누를 수 있고, 좋아요 순으로 정렬해 보여줍니다.", "category": "나만의 소개 웹페이지", "difficulty": "심화", "features": ["likes"], "folder": "016-intro-16", "resource": "entries", "label": "항목", "day": 1, "date": "2026-11-22"}, {"num": 17, "title": "비밀번호로 여는 비밀 일기 소개 페이지", "desc": "공개 소개 영역과, 비밀번호를 입력해야만 들어갈 수 있는 비공개 일기 영역을 나누세요. 일기 글은 DB에 저장되고, 비밀번호 검사는 서버에서 처리합니다.", "category": "나만의 소개 웹페이지", "difficulty": "심화", "features": [], "folder": "017-intro-17", "resource": "entries", "label": "항목", "day": 1, "date": "2026-11-22"}, {"num": 18, "title": "친구 추천사 페이지", "desc": "지인들이 나에 대한 추천사를 남기는 페이지입니다. 추천사는 제출 즉시 공개되지 않고 DB에 \"승인 대기\" 상태로 저장되며, 본인이 승인한 것만 페이지에 표시됩니다.", "category": "나만의 소개 웹페이지", "difficulty": "심화", "features": [], "folder": "018-intro-18", "resource": "entries", "label": "항목", "day": 1, "date": "2026-11-22"}, {"num": 19, "title": "내 위치와 날씨가 함께 뜨는 소개 페이지", "desc": "사는 도시를 소개하면서 외부 날씨 API를 연동해 그 도시의 현재 날씨를 함께 보여주세요. 도시 정보는 DB에 저장하고 관리자 페이지에서 바꿀 수 있습니다.", "category": "나만의 소개 웹페이지", "difficulty": "심화", "features": ["admin"], "folder": "019-intro-19", "resource": "entries", "label": "항목", "day": 1, "date": "2026-11-22"}, {"num": 20, "title": "미니 SNS형 프로필 페이지", "desc": esc": "글에 대표 이미지를 업로드할 수 있는 블로그입니다. 이미지 파일은 서버에 저장하고 파일 경로는 DB에 기록하며, 목록에서는 썸네일로 보여줍니다.", "category": "간단한 블로그", "difficulty": "입문", "features": ["upload"], "folder": "027-blog-07", "resource": "posts", "label": "글", "day": 1, "date": "2026-11-22"}, {"num": 28, "title": "좋아요와 조회수 블로그", "desc": "글마다 조회수를 자동 증가시키고, 로그인 사용자가 좋아요를 누를 수 있게 하세요. 인기 글을 조회수·좋아요 순으로 정렬하는 페이지도 만듭니다.", "category": "간단한 블로그", "difficulty": "기본", "features": ["auth", "likes"], "folder": "028-blog-08", "resource": "posts", "label": "글", "day": 1, "date": "2026-11-22"}, {"num": 29, "title": "임시저장 블로그", "desc": "글을 바로 발행하지 않고 임시저장할 수 있게 하세요. DB에 발행 상태를 저장해, 본인만 임시 글을 볼 수 있고 나중에 발행으로 바꿀 수 있습니다.", "category": "간단한 블로그", "difficulty": "기본", "features": [], "folder": "029-blog-09", "resource": "posts", "label": "글", "day": 1, "date": "2026-11-22"}, {"num": 30, "title": "마크다운 블로그", "desc": "본문을 마크다운 문법으로 쓰면 HTML로 변환해 보여주는 블로그입니다. 원본 마크다운은 DB에 저장하고, 미리보기 기능도 함께 구현하세요.", "category": "간단한 블로그", "difficulty": "기본", "features": [], "folder": "030-blog-10", "resource": "posts", "label": "글", "day": 1, "date": "2026-11-22"}, {"num": 31, "title": "구독과 피드 블로그", "desc": "다른 사용자를 구독하면 그 사람의 새 글이 내 피드에 모여 보이는 블로그를 만드세요. 구독 관계는 DB에 저장하고, 피드는 최신순으로 불러옵니다.", "category": "간단한 블로그", "difficulty": "기본", "features": [], "folder": "031-blog-11", "resource": "posts", "label": "글", "day": 1, "date": "2026-11-22"}, {"num": 32, "title": "북마크 블로그", "desc": "마음에 드는 글을 북마크해두고 \"내 북마크\" 페이지에서 모아 볼 수 있게 하세요. 북마크는 사용자별로 DB에 저장되고, 북마크 취소도 가능합니다.", "category": "간단한 블로그", "difficulty": "기본", "features": [], "folder": "032-blog-12", "resource": "posts", "label": "글", "day": 1, "date": "2026-11-22"}, {"num": 33, "title": "댓글 알림 블로그", "desc": "내 글에 댓글이 달리면 알림 목록에 표시되는 블로그입니다. 알림은 DB에 저장되고, 읽으면 읽음 상태로 바뀌며, 안 읽은 알림 개수를 배지로 보여줍니다.", "category": "간단한 블로그", "difficulty": "기본", "features": ["comments"], "folder": "033-blog-13", "resource": "posts", "label": "글", "day": 1, "date": "2026-11-22"}, {"num": 34, "title": "시리즈 블로그", "desc": "여러 글을 하나의  "desc": "레시피 재료 양을 DB에 숫자로 저장해두고, 인분을 바꾸면 재료 양이 자동으로 계산되어 표시되는 기능을 만드세요.", "category": "레시피 공유 웹사이트", "difficulty": "기본", "features": [], "folder": "068-recipes-08", "resource": "recipes", "label": "레시피", "day": 1, "date": "2026-11-22"}, {"num": 69, "title": "주간 식단표 레시피 사이트", "desc": "레시피를 골라 요일별 식단표에 배치하고 저장하는 기능입니다. 식단표는 로그인 사용자별로 DB에 저장되고, 식단표에서 바로 장보기 목록을 뽑아줍니다.", "category": "레시피 공유 웹사이트", "difficulty": "기본", "features": ["auth"], "folder": "069-recipes-09", "resource": "recipes", "label": "레시피", "day": 1, "date": "2026-11-22"}, {"num": 70, "title": "장보기 목록 생성 사이트", "desc": "스크랩한 레시피들의 재료를 합쳐 장보기 목록을 자동으로 만들고, 산 재료는 체크할 수 있게 하세요. 목록과 체크 상태는 DB에 저장됩니다.", "category": "레시피 공유 웹사이트", "difficulty": "기본", "features": [], "folder": "070-recipes-10", "resource": "recipes", "label": "레시피", "day": 1, "date": "2026-11-22"}, {"num": 71, "title": "냉장고 재료 관리 사이트", "desc": "내 냉장고 재료와 유통기한을 등록하면, 유통기한 임박 재료를 알려주고 그 재료로 만들 수 있는 레시피를 추천하는 사이트를 만드세요.", "category": "레시피 공유 웹사이트", "difficulty": "기본", "features": [], "folder": "071-recipes-11", "resource": "recipes", "label": "레시피", "day": 1, "date": "2026-11-22"}, {"num": 72, "title": "레시피 랭킹 사이트", "desc": "조회수, 좋아요, 평점을 합산해 이번 주 인기 레시피 랭킹을 보여주세요. 기록은 DB에 쌓고 기간별 집계를 구현합니다.", "category": "레시피 공유 웹사이트", "difficulty": "기본", "features": ["likes"], "folder": "072-recipes-12", "resource": "recipes", "label": "레시피", "day": 1, "date": "2026-11-22"}, {"num": 73, "title": "영상 레시피 사이트", "desc": "요리 영상 링크를 등록하고 썸네일과 함께 보여주는 사이트입니다. 영상 정보는 DB에 저장하고 카테고리 필터와 검색을 붙이세요.", "category": "레시피 공유 웹사이트", "difficulty": "기본", "features": ["search"], "folder": "073-recipes-13", "resource": "recipes", "label": "레시피", "day": 1, "date": "2026-11-22"}, {"num": 74, "title": "레시피 질문답변 사이트", "desc": "레시피마다 \"이 단계가 헷갈려요\" 같은 질문을 남기고 작성자가 답변하는 Q&A 기능을 만드세요. 질문과 답변은 DB에 저장되고 답변 완료 표시를 합니다.", "category": "레시피 공유 웹사이트", "difficulty": "기본", "features": [], "folder": "074-recipes-14", "resource": "recipes", "label": "레시피", "day": 1, "date": "2026-11-22"}, {"num": 75, " const REPO = 'https://github.com/mooncodes-dev/fullstack-portfolio/tree/main/projects';
const FEAT = { auth: '로그인/회원가입', comments: '댓글', likes: '좋아요', search: '검색', upload: '파일 업로드', admin: '관리자 통계' };
const cats = ['전체', ...new Set(DATA.map(d => d.category))];
let curCat = '전체', curQ = '';
const chipsEl = document.getElementById('chips');
cats.forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip' + (c === '전체' ? ' on' : '');
  b.textContent = c;
  b.onclick = () => { curCat = c; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.textContent === c)); render(); };
  chipsEl.appendChild(b);
});
document.getElementById('search').addEventListener('input', e => { curQ = e.target.value.trim(); render(); });
function render() {
  const list = DATA.filter(d =>
    (curCat === '전체' || d.category === curCat) &&
    (!curQ || (d.title + ' ' + d.desc + ' ' + d.category).includes(curQ)));
  document.getElementById('count').textContent = list.length + '개 프로젝트';
  document.getElementById('grid').innerHTML = list.map(d => `
    <article class="card">
      <div class="top"><span class="num">No. ${d.num}</span><span class="diff">${d.difficulty}</span></div>
      <h3>${d.title}</h3>
      <p class="cat">${d.category}</p>
      <p class="desc">${d.desc}</p>

    </article>`).join('');
}
render();
